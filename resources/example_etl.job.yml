resources:
  jobs:
    fr24_bronze_to_silver:
      name: "FR24 Bronze to Silver"
      parameters:
        - name: run_date
          default: ""
        - name: env
          default: "${bundle.target}"
        - name: input_filename
          default: ""

      tasks:
        - task_key: etl_task
          spark_python_task:
            python_file: ../src/mgfi/fr24/fr24_hourly.py
            parameters:
              - "--run-date"
              - "{{job.parameters.run_date}}"
              - "--env"
              - "{{job.parameters.env}}"
              - "--input-filename"
              - "{{job.parameters.input_filename}}"
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"


