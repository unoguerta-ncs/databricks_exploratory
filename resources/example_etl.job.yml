name: "Example ETL Job (with control table)"
parameters:
  - name: run_date
    default: "{{ current_time.strftime('%Y-%m-%d') }}"
  - name: env
    default: "dev"
tasks:
  - task_key: etl_task
    spark_python_task:
      python_file: src/etl.py
      parameters:
        - "--run-date"
        - "{{job.parameters.run_date}}"
        - "--env"
        - "{{job.parameters.env}}"
    compute:
      # Run on Databricks serverless
      serverless: {}
      
  - task_key: etl_notebook
    depends_on:
      - task_key: etl_task
    notebook_task:
      notebook_path: notebooks/etl_notebook.ipynb
      base_parameters:
        run_date: "{{job.parameters.run_date}}"
        env: "{{job.parameters.env}}"
    compute:
      serverless: {}
