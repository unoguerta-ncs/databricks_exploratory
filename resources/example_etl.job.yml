resources:
  jobs:
    fr24_bronze_to_silver:
      name: "FR24 Bronze to Silver"

      # ✅ Correct schedule placement for DAB v2
      schedule:
        quartz_cron_expression: "0 5 * * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      # job_clusters:
      #   - job_cluster_key: std_job_cluster
      #     new_cluster:
      #       spark_version: "14.3.x-scala2.12"
      #       node_type_id: "i3.xlarge"
      #       num_workers: 2
      #       data_security_mode: "SINGLE_USER"
      #       autotermination_minutes: 30

      parameters:
        - name: run_date
          default: ""
        - name: env
          default: "${bundle.target}"
        - name: input_filename
          default: ""
        - name: run_date_utc
          default: ""
        - name: source_system
          default: "fr24"
        - name: catalog
          default: "mgfi_catalog_test"
        - name: schema
          default: "sandbox"
        - name: raw_base_path
          default: "/Volumes/mgfi_catalog_test/sandbox/fr24_bronze_vol"

      tasks:
        - task_key: fr24_hourly
          spark_python_task:
            python_file: ../src/mgfi/fr24/fr24_hourly.py
            parameters:
              - "--run-date-utc"
              - "{{job.parameters.run_date_utc}}"
              - "--env"
              - "{{job.parameters.env}}"
              - "--input-filename"
              - "{{job.parameters.input_filename}}"
              - "--source-system"
              - "{{job.parameters.source_system}}"
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--raw-base-path"
              - "{{job.parameters.raw_base_path}}"
          # job_cluster_key: std_job_cluster
          existing_cluster_id: "1009-031438-chqdgmi8"
          max_retries: 1
          min_retry_interval_millis: 10000
          timeout_seconds: 0

        - task_key: fr24_bronze_to_silver
          depends_on:
            - task_key: fr24_hourly
          spark_python_task:
            python_file: ../src/mgfi/fr24_b2s/fr24_bronze_to_silver.py
            parameters:
              - "--env"
              - "{{job.parameters.env}}"
              - "--run-date-utc"
              - "{{job.parameters.run_date_utc}}"
              - "--source-system"
              - "{{job.parameters.source_system}}"
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
          # job_cluster_key: std_job_cluster
          existing_cluster_id: "1009-031438-chqdgmi8"
          max_retries: 1
          min_retry_interval_millis: 10000
          timeout_seconds: 0
