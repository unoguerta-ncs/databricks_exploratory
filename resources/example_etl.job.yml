resources:
  jobs:
    example_etl:
      name: "Example ETL Job (with control table)"
      parameters:
        - name: run_date
          default: ""
        - name: env
          default: "dev"
        - name: input_filename
          default: ""

      tasks:
        - task_key: etl_task
          spark_python_task:
            python_file: ../src/etl.py
            parameters:
              - "--run-date"
              - "{{job.parameters.run_date}}"
              - "--env"
              - "{{job.parameters.env}}"
              - "--input-filename"
              - "{{job.parameters.input_filename}}"
          environment_key: serverless

        - task_key: etl_notebook
          notebook_task:
            notebook_path: ../src/etl_notebook.ipynb
            base_parameters:
              run_date: "{{job.parameters.run_date}}"
              env: "{{job.parameters.env}}"
              input_filename: "{{job.parameters.input_filename}}" 

      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
