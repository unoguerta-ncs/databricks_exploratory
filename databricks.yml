bundle:
  name: my-dataproj

resources:
  jobs:
    example-etl:
      name: "Example ETL Job (rerun)"
      parameters:
        - name: run_date
          default: "2025-09-23"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: etl_task
          spark_python_task:
            python_file: src/etl.py
            parameters:
              - "--run-date"
              - "{{job.parameters.run_date}}"
          environment_key: default

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production